[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "fgmapping-engineering"
version = "0.6.0a1"
description = "Development build of an offline-first fire and gas mapping engineering application"
requires-python = ">=3.12,<3.13"
[tool.setuptools.packages.find]
where = ["src"]
